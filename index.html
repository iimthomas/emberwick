<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- 🔁 THE ENTRY HTML MUST NEVER BE CACHED. Every asset here is versioned with ?v=N,
     but this file cannot version itself - so a cached copy quietly serves an OLD ?v= and
     the browser runs yesterday's game while the server holds today's. That has cost this
     project two debugging sessions (a "missing" economy change, then missing art).
     Revalidating ONLY this file is cheap: it is 1KB, and everything it pulls stays cached. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Emberwick — a candlelit puzzle-strategy roguelite card game.">
<title>Emberwick</title>
<meta name="theme-color" content="#16140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberwick">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=320">
</head>
<body>
<header>
  <h1><span class="mark">🕯️</span> Emberwick</h1>
  <div id="turn-indicator"></div>
  <button id="report-btn" onclick="copyReport()" title="Copy what the game is doing right now, to paste into a bug report">📋 Report</button>
  <button id="menu-btn" onclick="toMenu()" title="Back to the main menu — your run is saved">🏠 Menu</button>
  <button id="newrun-btn" onclick="newGame()" title="Start this stage again from the beginning">⟳ New Run</button>
</header>

<div id="status-bar"></div>

<main>
  <div id="left-col">
    <section id="scene"></section>
    <div id="hud">
      <section id="encounter-panel"></section>
    </div>
    <!-- 🎴 THE FIELD — persistent state as tokens, sitting on the table in front of your hand.
         Empty until you hold something, and it collapses to nothing when you don't. -->
    <section id="field"></section>
    <section id="slots-panel"></section>
    <section id="controls-panel"></section>

    <!-- 🚪 THE MODAL LAYER lives INSIDE #left-col so it covers the GAME and never the log.
         Thomas: *"was hoping it wouldn't cover the log either and was just over the actual game
         part."* #left-col is position:relative, so inset:0 scopes it exactly. -->
    <div id="modal-layer" aria-live="polite">
      <div id="modal-backdrop"></div>
      <div id="modal-panel"></div>
    </div>
  </div>
  <div id="right-col">
    <h2>Turn Log</h2>
    <div id="log"></div>
  </div>
</main>

<script src="game.js?v=320"></script>
</body>
</html>
